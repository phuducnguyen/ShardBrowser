<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HeroV Browser · Profiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../design-system/tokens.css">
  <link rel="stylesheet" href="../../design-system/components.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-quick" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6.5" rx="2"/><rect x="4" y="13.5" width="16" height="6.5" rx="2"/><path d="M8 7.25h.01M8 16.75h.01"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5a3.5 3.5 0 0 1 0 6.5M21 20c0-2.6-1.5-4.6-3.5-5.5"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M12 5h.01M12 12h.01M12 19h.01" stroke-width="3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></symbol>
    <symbol id="i-checkbox" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-search-check" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4M8.5 11l2 2 3.5-3.5"/></symbol>
    <symbol id="i-herov" viewBox="0 0 40 40"><path d="M20 3 34.5 8.2V19c0 8.4-5.8 14.6-14.5 18C11.3 33.6 5.5 27.4 5.5 19V8.2z" fill="currentColor" stroke="none"/><path d="M20 3 5.5 8.2V19c0 8.4 5.8 14.6 14.5 18z" fill="#fff" fill-opacity=".18" stroke="none"/><path d="M12.8 13.5 20 27.5l7.2-14" fill="none" style="stroke:var(--logo-facet,#fff)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="app">
  <nav class="rail" aria-label="Primary">
    <div class="logo" role="img" aria-label="HeroV Browser" title="HeroV Browser"><svg aria-hidden="true"><use href="#i-herov"/></svg></div>
    <div class="new-split">
      <button type="button" id="btn-new" aria-label="New profile"><svg class="ico"><use href="#i-plus"/></svg></button>
      <button type="button" id="btn-quick" aria-label="Quick profile"><svg class="ico"><use href="#i-quick"/></svg></button>
    </div>
    <button type="button" class="rail-btn is-active" id="nav-profiles" aria-current="page"><span class="pillbox"><svg class="ico"><use href="#i-grid"/></svg></span>Profiles</button>
    <button type="button" class="rail-btn" id="nav-proxies"><span class="pillbox"><svg class="ico"><use href="#i-server"/></svg></span>Proxies</button>
    <button type="button" class="rail-btn"><span class="pillbox"><svg class="ico"><use href="#i-bolt"/></svg></span>Automation</button>
    <button type="button" class="rail-btn"><span class="pillbox"><svg class="ico"><use href="#i-bot"/></svg></span>Scripts</button>
    <button type="button" class="rail-btn"><span class="pillbox"><svg class="ico"><use href="#i-sync"/></svg></span>Sync</button>
    <button type="button" class="rail-btn"><span class="pillbox"><svg class="ico"><use href="#i-users"/></svg></span>Team</button>
    <button type="button" class="rail-btn"><span class="pillbox"><svg class="ico"><use href="#i-doc"/></svg></span>Logs</button>
    <div class="spacer"></div>
    <button type="button" class="rail-btn"><span class="pillbox"><svg class="ico"><use href="#i-gear"/></svg></span>Settings</button>
    <button type="button" class="rail-btn" id="btn-theme" aria-label="Toggle dark theme"><span class="pillbox"><svg class="ico"><use href="#i-moon"/></svg></span>Theme</button>
  </nav>

  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn" aria-label="Toggle sidebar"><svg class="ico"><use href="#i-menu"/></svg></button>
      <h1 id="page-title">Profiles</h1>
      <span class="grow"></span>
      <button type="button" class="pill"><svg class="ico" style="width:16px;height:16px"><use href="#i-server"/></svg>Buy proxy</button>
      <span class="avatar" aria-label="Account">PD</span>
    </header>

    <!-- ===== Profiles ===== -->
    <section class="view" id="view-profiles" aria-labelledby="page-title">
      <aside class="panel" aria-label="Folders">
        <div class="panel-title"><svg class="ico" style="width:16px;height:16px"><use href="#i-search"/></svg>Folder</div>
        <div id="folder-list" role="list"></div>
      </aside>
      <div class="card stack" style="overflow:hidden">
        <div class="toolbar">
          <span class="grow"></span>
          <button type="button" class="tool-btn" aria-label="Activity history"><svg class="ico"><use href="#i-clock"/></svg></button>
          <button type="button" class="tool-btn" aria-label="Restore profiles"><svg class="ico"><use href="#i-refresh"/></svg></button>
          <button type="button" class="tool-btn" aria-label="Bulk actions"><svg class="ico"><use href="#i-checkbox"/></svg></button>
          <button type="button" class="tool-btn" aria-label="Reload list" id="btn-reload"><svg class="ico"><use href="#i-sync"/></svg></button>
          <button type="button" class="tool-btn" aria-label="Screen layout"><svg class="ico"><use href="#i-screen"/></svg></button>
          <label class="search"><svg class="ico" style="width:18px;height:18px"><use href="#i-search"/></svg><span class="sr-only">Search profiles</span><input id="search" type="search" placeholder="Search…" autocomplete="off"></label>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th><input class="chk" type="checkbox" id="chk-all" aria-label="Select all profiles"></th>
              <th>#</th><th>Profile name</th><th>Browser</th><th>Status</th><th>Proxy type</th><th>Proxy</th><th><span class="sr-only">Actions</span></th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ===== New profile ===== -->
    <section class="view" id="view-new" hidden aria-label="New profile">
      <aside class="panel" aria-label="Profile settings">
        <div id="tablist" role="tablist" aria-orientation="vertical"></div>
      </aside>
      <div class="stack">
        <div class="card formbar">
          <input class="field-dashed" id="f-name" type="text" placeholder="Profile name" aria-label="Profile name" aria-describedby="name-err" autocomplete="off">
          <select class="select" id="f-folder" aria-label="Folder"><option value="">Choose folder</option></select>
          <button type="button" class="btn btn-primary" id="btn-create"><svg class="ico"><use href="#i-plus"/></svg>Create</button>
        </div>
        <p id="name-err" class="sr-only" role="alert"></p>
        <div class="card" id="tabpanels" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
